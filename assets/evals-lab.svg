<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
<rect width="1200" height="240" rx="14" fill="#000000"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<text x="64" y="84" font-size="32" font-weight="600" letter-spacing="-1" fill="#FFFFFF">Evals Lab</text>
<text x="64" y="120" font-size="15" fill="#4C7DFF">View project →</text>
<text x="64" y="150" font-size="14" fill="#8B909C">38% → 100%</text>
<text x="440" y="62" font-size="17" font-weight="400" fill="#D4D7DE">A hands-on workshop for taking an enterprise AI agent from demo to</text>
<text x="440" y="88" font-size="17" font-weight="400" fill="#D4D7DE">production. A policy copilot for a fictional bank is graded on 26 cases,</text>
<text x="440" y="115" font-size="17" font-weight="400" fill="#D4D7DE">including trap questions the manual never covers, and climbs from 38% to 58%</text>
<text x="440" y="141" font-size="17" font-weight="400" fill="#D4D7DE">to 100% across three versions.</text>
<rect x="440" y="170" width="70" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="475" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">Python</text>
<rect x="518" y="170" width="150" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="593" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">OpenAI Agents SDK</text>
<rect x="675" y="170" width="106" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="728" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">File search</text>
<rect x="790" y="170" width="62" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="821" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">Evals</text>
<rect x="860" y="170" width="113" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="917" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">LLM-as-judge</text>
<rect x="981" y="170" width="84" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="1023" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">Pydantic</text>
<rect x="1074" y="170" width="62" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="1105" y="190" font-size="13" fill="#D4D7DE" text-anchor="middle">Codex</text>
</g>
