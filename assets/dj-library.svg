<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="214" viewBox="0 0 1200 214">
<rect width="1200" height="214" rx="14" fill="#000000"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<text x="64" y="84" font-size="32" font-weight="600" letter-spacing="-1" fill="#FFFFFF">DJ Library Organizer</text>
<text x="64" y="120" font-size="15" fill="#4C7DFF">View project →</text>
<text x="64" y="150" font-size="14" fill="#8B909C">Write-up on Substack</text>
<text x="440" y="62" font-size="17" font-weight="400" fill="#D4D7DE">Turns an unstructured local music library into harmonically compatible</text>
<text x="440" y="88" font-size="17" font-weight="400" fill="#D4D7DE">crates using Camelot key clustering, has Claude name each playlist, and</text>
<text x="440" y="115" font-size="17" font-weight="400" fill="#D4D7DE">exports to rekordbox. Built for my own sets as a working DJ in New York.</text>
<rect x="440" y="144" width="62" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="471" y="164" font-size="13" fill="#D4D7DE" text-anchor="middle">React</text>
<rect x="510" y="144" width="77" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="549" y="164" font-size="13" fill="#D4D7DE" text-anchor="middle">Node.js</text>
<rect x="595" y="144" width="99" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="645" y="164" font-size="13" fill="#D4D7DE" text-anchor="middle">Claude API</text>
<rect x="702" y="144" width="121" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="762" y="164" font-size="13" fill="#D4D7DE" text-anchor="middle">rekordbox XML</text>
<rect x="831" y="144" width="121" height="30" rx="15" fill="#0B0B0D" stroke="#24262C"/><text x="891" y="164" font-size="13" fill="#D4D7DE" text-anchor="middle">Camelot wheel</text>
</g>
</svg>
